name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: sandbox-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: lint, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-kind:
    name: deploy to ephemeral kind cluster
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build image
        run: docker build -t "$IMAGE:$IMAGE_TAG" .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sandbox
          wait: 120s

      - name: Load image into cluster
        run: kind load docker-image "$IMAGE:$IMAGE_TAG" --name sandbox

      - name: Deploy
        run: |
          sed -i "s|image: $IMAGE:dev|image: $IMAGE:$IMAGE_TAG|" k8s/deployment.yaml
          kubectl apply -k k8s/

      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: kubectl rollout status deployment/sandbox-app --timeout=90s

      - name: Stability check (pods ready, no restarts after 15s)
        id: stability
        if: steps.rollout.outcome == 'success'
        continue-on-error: true
        run: |
          sleep 15
          kubectl get pods -l app=sandbox-app -o wide
          kubectl get pods -l app=sandbox-app -o json > /tmp/pods.json
          node -e '
            const pods = JSON.parse(require("fs").readFileSync("/tmp/pods.json","utf8")).items;
            const bad = [];
            for (const p of pods) {
              for (const c of (p.status.containerStatuses ?? [])) {
                if (!c.ready) bad.push(`${p.metadata.name}: container ${c.name} not ready (${Object.keys(c.state)[0]}${c.state.waiting?.reason ? ": " + c.state.waiting.reason : ""}${c.state.terminated?.reason ? ": " + c.state.terminated.reason : ""})`);
                if ((c.restartCount ?? 0) > 0) bad.push(`${p.metadata.name}: container ${c.name} restarted ${c.restartCount}x`);
              }
            }
            if (pods.length === 0) bad.push("no pods found for app=sandbox-app");
            if (bad.length) { console.error("UNSTABLE:\n" + bad.join("\n")); process.exit(1); }
            console.log(`stable: ${pods.length} pod(s) ready, no restarts`);
          '

      - name: Smoke test
        id: smoke
        if: steps.stability.outcome == 'success'
        continue-on-error: true
        run: |
          kubectl port-forward service/sandbox-app 3000:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          echo "health: $(cat /tmp/health.json)"
          grep -q '"status":"ok"' /tmp/health.json

      - name: Browser check (Playwright, no vision)
        id: e2e
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:3000 npx playwright test

      - name: Collect cluster diagnostics
        if: always()
        run: |
          mkdir -p diag
          kubectl get pods -o wide > diag/pods.txt 2>&1 || true
          kubectl get events --sort-by=.lastTimestamp > diag/events.txt 2>&1 || true
          kubectl describe deployment/sandbox-app > diag/deployment.txt 2>&1 || true
          for p in $(kubectl get pods -l app=sandbox-app -o name); do
            n=${p#pod/}
            kubectl describe "$p" > "diag/describe-$n.txt" 2>&1 || true
            kubectl logs "$p" --all-containers > "diag/logs-$n.txt" 2>&1 || true
            kubectl logs "$p" --all-containers --previous > "diag/logs-previous-$n.txt" 2>&1 || true
          done
          kubectl get pods -l app=sandbox-app -o json > diag/pods.json 2>/dev/null || echo '{"items":[]}' > diag/pods.json
          kubectl get events -o json > diag/events.json 2>/dev/null || echo '{"items":[]}' > diag/events.json
          node scripts/build-snapshot.mjs diag > diag/snapshot.json
          {
            echo "## Deploy result"
            echo ""
            echo "| step | outcome |"
            echo "|---|---|"
            echo "| rollout | ${{ steps.rollout.outcome }} |"
            echo "| stability | ${{ steps.stability.outcome }} |"
            echo "| smoke | ${{ steps.smoke.outcome }} |"
            echo "| browser | ${{ steps.e2e.outcome }} |"
            echo ""
            echo "## Pods"
            echo '```'
            cat diag/pods.txt
            echo '```'
            echo "## Events (last 30)"
            echo '```'
            tail -n 30 diag/events.txt
            echo '```'
            for f in diag/logs-*.txt; do
              [ -s "$f" ] || continue
              grep -qE 'unable to retrieve container logs|previous terminated container' "$f" && continue
              echo "## $(basename "$f" .txt)"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cluster snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cluster-snapshot
          path: diag/
          retention-days: 7

      - name: Upload Playwright report
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Fail if deploy, stability, smoke or browser check failed
        if: steps.rollout.outcome != 'success' || steps.stability.outcome != 'success' || steps.smoke.outcome != 'success' || steps.e2e.outcome != 'success'
        run: |
          echo "outcomes: rollout=${{ steps.rollout.outcome }} stability=${{ steps.stability.outcome }} smoke=${{ steps.smoke.outcome }} browser=${{ steps.e2e.outcome }}"
          echo "The steps above keep a green tick because the job continues to collect diagnostics; the outcomes line is the verdict."
          echo "The cluster-snapshot artifact holds the same evidence as text and JSON."
          echo; echo "## pods"; cat diag/pods.txt
          echo; echo "## events (last 30)"; tail -n 30 diag/events.txt
          for f in diag/logs-*.txt; do
            [ -s "$f" ] || continue
            grep -qE 'unable to retrieve container logs|previous terminated container' "$f" && continue
            echo; echo "## $(basename "$f" .txt)"; tail -n 40 "$f"
          done
          if [ "${{ steps.e2e.outcome }}" = "failure" ]; then
            echo; echo "## browser check failed: see the playwright-report artifact; a 'strict mode violation' names the colliding elements above in this job's log"
          fi
          exit 1
